# This workflow marks and closes long-inactive issues.
# Docs: https://github.com/actions/stale
name: Mark stale issues

on:
  schedule:
    # Run daily at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview only, does not actually execute (Dry run mode)'
        required: false
        default: true
        type: boolean

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Ensure label color is correct
        # Only run in non-dry-run mode to avoid errors/side effects during preview
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "status/stale" --color "EDEDED" --description "Issue with no activity for a long time" || gh label edit "status/stale" --color "EDEDED" --description "Issue with no activity for a long time"

      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 200

          any-of-labels: 'type/fix,bug'

          # Do not process PRs
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # Inactivity judgment and closing strategy: mark stale first, then delay the close
          days-before-issue-stale: 60
          days-before-issue-close: 30

          stale-issue-label: 'status/stale'
          stale-issue-message: |
            This issue has been automatically marked as **status/stale** because it has not had any activity.
            It will be closed in a certain period of time if no further activity occurs.
            If this issue is still relevant, please leave a comment.

          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If the problem still exists, feel free to reopen or create a new issue with updated information.

          remove-stale-when-updated: true

          debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
