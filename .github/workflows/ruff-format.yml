name: 🐍 Code Format & Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master, dev/* ]

jobs:
  ruff-check:
    name: Ruff Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Run Ruff format and fix
        id: ruff
        # Use || true so that errors do not abort immediately; the report is generated in a later step.
        run: |
          echo "Using ruff version..."
          uvx ruff==0.14.2 --version

          echo "Running ruff format..."
          FORMAT_LOG=$(uvx ruff==0.14.2 format . 2>&1 || true)
          echo "$FORMAT_LOG"

          echo "Running ruff check --fix..."
          CHECK_LOG=$(uvx ruff==0.14.2 check --fix . 2>&1 || true)
          echo "$CHECK_LOG"

          # Save the logs to files for the later script to read
          echo "$FORMAT_LOG" > format.log
          echo "$CHECK_LOG" > check.log

      - name: Generate report and comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const formatLog = fs.readFileSync('format.log', 'utf8');
            const checkLog = fs.readFileSync('check.log', 'utf8');

            // --- Parse the format log ---
            // Example: "1 file reformatted, 2 files left unchanged."
            const formatMatch = formatLog.match(/(\d+) file(s)? reformatted/);
            const reformattedCount = formatMatch ? parseInt(formatMatch[1]) : 0;

            const unchangedMatch = formatLog.match(/(\d+) file(s)? left unchanged/);
            const unchangedCount = unchangedMatch ? parseInt(unchangedMatch[1]) : 0;

            // --- Parse the check log ---
            // Example: "Found 2 errors (1 fixed, 1 remaining)."
            let fixedCount = 0;
            let remainingCount = 0;
            let totalErrors = 0;

            const errorMatch = checkLog.match(/Found (\d+) error/);
            if (errorMatch) {
                totalErrors = parseInt(errorMatch[1]);

                const fixedMatch = checkLog.match(/\((\d+) fixed/);
                if (fixedMatch) fixedCount = parseInt(fixedMatch[1]);

                const remainingMatch = checkLog.match(/, (\d+) remaining\)/);
                if (remainingMatch) {
                    remainingCount = parseInt(remainingMatch[1]);
                } else {
                    // If there is no detailed fixed/remaining info, it usually means nothing was fixed or all errors remain
                    if (fixedCount === 0) remainingCount = totalErrors;
                }
            }

            // --- Build the report ---
            let summary = '';
            let isSuccess = (reformattedCount === 0 && remainingCount === 0);

            if (isSuccess) {
                summary = '### ✅ All checked pass!';
            } else {
                summary = '### ⚠️ Code Quality Check Report\n\n';
                summary += '> Some files need formatting or contain code issues. It is recommended to run `ruff format .` and `ruff check --fix .` locally.\n\n';

                // Formatting section
                if (reformattedCount > 0) {
                    summary += `**🖌️ Formatting**: \`${reformattedCount}\` file(s) reformatted (unchanged: ${unchangedCount})\n`;
                } else {
                    summary += `**🖌️ Formatting**: ✅ No changes needed\n`;
                }

                // Check section
                if (totalErrors > 0) {
                    summary += `**🛡️ Check**: found \`${totalErrors}\` issue(s)\n`;
                    summary += `- 🛠️ Auto-fixed: \`${fixedCount}\`\n`;
                    summary += `- ❌ Remaining: \`${remainingCount}\`\n`;
                } else {
                    summary += `**🛡️ Check**: ✅ Passed\n`;
                }

                // Error details (if any remaining)
                if (remainingCount > 0) {
                    // Truncate the log if it is too long
                    const logPreview = checkLog.length > 2000 ? checkLog.substring(0, 2000) + '\n... (log truncated)' : checkLog;
                    summary += `\n<details><summary>🔍 Error details</summary>\n\n\`\`\`text${logPreview}\n\n\`\`\`\n</details>`;
                }
            }

            // --- Write to the Job Summary ---
            await core.summary.addRaw(summary).write();

            // --- PR comment (only when triggered by a PR event) ---
            if (context.eventName === 'pull_request') {
                const issue_number = context.issue.number;
                const owner = context.repo.owner;
                const repo = context.repo.repo;

                // Get existing comments
                const comments = await github.rest.issues.listComments({
                    owner,
                    repo,
                    issue_number,
                });

                // Find the bot's previous Ruff report comment
                const botComment = comments.data.find(comment =>
                    comment.user.type === 'Bot' &&
                    (comment.body.includes('Code Quality Check Report') || comment.body.includes('All checked pass'))
                );

                if (botComment) {
                    // If a comment already exists, update it
                    await github.rest.issues.updateComment({
                        owner,
                        repo,
                        comment_id: botComment.id,
                        body: summary
                    });
                } else {
                    // If none exists and the check failed, create a new comment
                    // (If it passed and there was no previous comment, do nothing to keep things clean; unless you want users to know it passed)
                    // Logic: if there are issues -> post/update; if OK -> only update when a previous failure comment exists, otherwise do not bother.
                    if (!isSuccess) {
                        await github.rest.issues.createComment({
                            owner,
                            repo,
                            issue_number,
                            body: summary
                        });
                    }
                }
            }

            // --- Set job status ---
            if (!isSuccess) {
                core.setFailed('Code format or quality check failed, please review the report.');
            }
