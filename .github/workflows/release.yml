name: 📦 Draft Release (Tag with v)

on:
  push:
    tags:
      - "*v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build WebUI and package plugin
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="astrbot_plugin_disaster_warning"
          BUILD_ROOT="${RUNNER_TEMP}/plugin-build"
          STAGE_DIR="${BUILD_ROOT}/${PACKAGE_NAME}"
          ZIP_NAME="${PACKAGE_NAME}-${GITHUB_REF_NAME}.zip"

          rm -rf "${BUILD_ROOT}"
          mkdir -p "${STAGE_DIR}"

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.idea/' \
            --exclude '.devin/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.DS_Store' \
            ./ "${STAGE_DIR}/"

          pushd "${STAGE_DIR}"

          if [[ ! -d "admin/js" ]]; then
            echo "::error::admin/js not found, cannot build the WebUI"
            exit 1
          fi

          BUILD_JS_DIR="admin/.js-build"
          BABEL_TOOLS_DIR="${RUNNER_TEMP}/babel-tools"
          rm -rf "${BUILD_JS_DIR}"
          mkdir -p "${BUILD_JS_DIR}"

          rm -rf "${BABEL_TOOLS_DIR}"
          mkdir -p "${BABEL_TOOLS_DIR}"
          pushd "${BABEL_TOOLS_DIR}"
          npm init -y >/dev/null 2>&1
          npm install --no-save @babel/core @babel/cli @babel/preset-react @babel/plugin-transform-block-scoping
          popd

          # Note:
          # The WebUI currently uses a multi-file global-script structure, and many files
          # redeclare `const { ... } = React/MaterialUI`.
          # When executed as plain scripts, const/let cannot be redeclared, which triggers
          # "Identifier has already been declared" and results in a blank screen.
          # Use only preset-react (JSX compilation) + plugin-transform-block-scoping (const/let → var).
          # Do NOT use preset-env, which may skip block-scoping transforms for modern browser
          # targets and leave const declarations behind.
          NODE_PATH="${BABEL_TOOLS_DIR}/node_modules" \
          "${BABEL_TOOLS_DIR}/node_modules/.bin/babel" admin/js \
            --extensions ".js,.jsx" \
            --out-dir "${BUILD_JS_DIR}" \
            --presets @babel/preset-react \
            --plugins @babel/plugin-transform-block-scoping \
            --no-babelrc

          rm -rf admin/js
          mv "${BUILD_JS_DIR}" admin/js

          sed -i 's|<script type="text/babel" src="js/\([^"]*\)\.jsx" defer></script>|<script src="js/\1.js" defer></script>|g' admin/index.html
          sed -i 's|<script type="text/babel" src="js/\([^"]*\)\.js" defer></script>|<script src="js/\1.js" defer></script>|g' admin/index.html
          sed -i '/lib\/babel\.min\.js/d' admin/index.html
          rm -f admin/lib/babel.min.js

          if grep -q 'text/babel' admin/index.html; then
            echo "::error::index.html still contains text/babel references after the WebUI build"
            exit 1
          fi

          if find admin/js -type f -name '*.jsx' | grep -q .; then
            echo "::error::.jsx source files still exist after the WebUI build"
            exit 1
          fi

          if grep -R -n -E '^[[:space:]]*const[[:space:]]+\{[^}]+\}[[:space:]]*=[[:space:]]*(React|MaterialUI)[[:space:]]*;' admin/js >/dev/null; then
            echo "::error::WebUI build still contains top-level const destructuring, which may cause browser redeclaration"
            exit 1
          fi

          popd

          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cd "${BUILD_ROOT}"
          zip -r "${GITHUB_WORKSPACE}/dist/${ZIP_NAME}" "${PACKAGE_NAME}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.zip
