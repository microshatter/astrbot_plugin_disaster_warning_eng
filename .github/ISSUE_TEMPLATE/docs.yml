name: '📚 文档改进建议 / Documentation Improvement'
description: 提交文档错误、缺失说明或改进建议。/ Submit documentation errors, missing information, or improvement suggestions.
title: '[Docs] '
labels: [ 'type/docs' ]
body:
  - type: markdown
    attributes:
      value: |
        感谢您抽出时间帮助我们改进文档！如果您发现 README、配置说明、接口文档、示例或使用引导存在错误、缺失或难以理解的地方，请通过该模板告诉我们。

        Thank you for taking the time to help us improve the documentation! If you found errors, missing information, or hard-to-understand parts in the README, configuration guides, API docs, examples, or usage instructions, please let us know through this template.

  - type: textarea
    attributes:
      label: 文档问题描述 / Description of the documentation issue
      description: 请简要说明你发现了什么问题。/ Please briefly describe what problem you found.
      placeholder: >
        如: README 中某个配置项说明过于简略，实际使用时不清楚其取值范围和影响。
        / E.g.: A config item in the README is too brief, and it's unclear what values it accepts and what it affects.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 涉及的文档位置 / Location of the documentation
      description: 请提供相关文档名称、章节、链接或文件路径。/ Please provide the document name, section, link, or file path.
      placeholder: >
        如: README.md 的“配置说明”章节，或某文档中的某一节。
        / E.g.: The "Configuration" section of README.md, or a specific section of a document.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 你期望如何改进？/ How would you like it improved?
      description: 请描述你认为更清晰的写法、应补充的信息，或你希望看到的示例。/ Please describe the clearer wording you think of, the information that should be added, or the examples you would like to see.
      placeholder: >
        如: 希望补充字段含义、默认值、示例配置，以及与不同适配器相关的说明。
        / E.g.: I'd like field meanings, default values, example configs, and notes about different adapters to be added.
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 文档问题类型 / Type of documentation issue
      description: 请选择最接近的一项。/ Please select the closest option.
      options:
        - '内容错误或过期 / Incorrect or outdated content'
        - '说明缺失或不完整 / Missing or incomplete explanation'
        - '示例不足或难以复现 / Insufficient examples or hard to reproduce'
        - '表述不清晰，容易误解 / Unclear wording, easy to misunderstand'
        - '排版、格式或链接问题 / Layout, formatting, or link issues'
        - '其他 / Other'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 相关消息平台（可选）/ Related message platform (optional)
      description: 如果该文档问题与某个平台相关，请选择最接近的一项；如与所有平台通用，可留空或在补充说明中写“全平台”。/ If the documentation issue relates to a specific platform, select the closest option; if it applies to all platforms, leave it blank or write "All platforms" in the notes.
      options:
        - 'QQ 官方机器人 (Websockets 方式) / QQ Official Bot (Websockets)'
        - 'QQ 官方机器人 (Webhook 方式) / QQ Official Bot (Webhook)'
        - 'OneBot v11 (原 QQ 个人号) / OneBot v11 (legacy QQ personal account)'
        - '企微应用 / WeCom App'
        - '企微智能机器人 / WeCom Smart Robot'
        - '微信公众号 / WeChat Official Account'
        - '个人微信 / Personal WeChat'
        - '飞书 / Feishu (Lark)'
        - '钉钉 / DingTalk'
        - 'Telegram'
        - 'LINE'
        - 'Slack'
        - 'Misskey'
        - 'Discord'
        - 'KOOK'
        - 'Satori (接入 Satori) / Satori (via Satori)'
        - 'Satori (使用 server-satori) / Satori (using server-satori)'
        - 'Matrix (社区提供) / Matrix (community-provided)'
        - 'VoceChat (社区提供) / VoceChat (community-provided)'
        - '其他平台 / Other platform'

  - type: input
    attributes:
      label: 其他平台名称（如选择“其他平台”请填写）/ Other platform name (required if you selected "Other platform")
      description: 如果你上面选择了“其他平台”，请在这里补充实际平台名称；否则可留空。/ If you selected "Other platform" above, please specify the actual platform name here; otherwise you can leave it blank.
      placeholder: '如: 全平台 / 自定义适配器 / 某社区平台 / E.g.: all platforms / custom adapter / some community platform'

  - type: dropdown
    attributes:
      label: 相关部署方式（可选）/ Related deployment method (optional)
      description: 如果该文档问题与你的部署环境相关，请选择最接近的一项。/ If the documentation issue relates to your deployment environment, please select the closest option.
      options:
        - 'uv 一键部署 / uv one-click deployment'
        - 'Docker / Docker Compose 部署 / Docker / Docker Compose deployment'
        - 'RainYun 一键云部署 / RainYun one-click cloud deployment'
        - 'AstrBot App 桌面应用部署 / AstrBot App desktop deployment'
        - 'AstrBot Launcher 部署 / AstrBot Launcher deployment'
        - 'Replit 部署 / Replit deployment'
        - 'AUR 部署 / AUR deployment'
        - 'BT-Panel 部署 / BT-Panel deployment'
        - '1Panel 部署 / 1Panel deployment'
        - 'CasaOS 部署 / CasaOS deployment'
        - '手动部署（CLI / 源码 / uv）/ Manual deployment (CLI / source / uv)'
        - '其他 / Other'
        - '不确定 / Not sure'

  - type: textarea
    attributes:
      label: 使用背景（可选）/ Usage background (optional)
      description: 如果该问题与你的部署方式、适配器、AstrBot 版本或插件版本有关，可以在这里补充。/ If the issue relates to your deployment method, adapter, AstrBot version, or plugin version, you can add details here.
      placeholder: >
        如: AstrBot Launcher 部署, AstrBot v4.22.1, QQ 官方机器人 (Webhook 方式), 插件 v1.2.0。
        / E.g.: AstrBot Launcher deployment, AstrBot v4.22.1, QQ Official Bot (Webhook), plugin v1.2.0.

  - type: textarea
    attributes:
      label: 可参考的内容（可选）/ Reference material (optional)
      description: 如你已经写好了建议文案、示例配置、截图或对照资料，可在这里附上。/ If you have already drafted suggested copy, example configs, screenshots, or comparison material, you can attach it here.
      placeholder: >
        可粘贴建议文本、示例配置、截图链接或其他补充材料。
        / You can paste suggested text, example configs, screenshot links, or other supporting material.

  - type: checkboxes
    attributes:
      label: 你愿意提交 PR 吗？/ Would you like to submit a PR?
      description: 这不是必须的，但我们欢迎您直接参与文档改进。/ This is not required, but we welcome you to directly participate in improving the documentation.
      options:
        - label: 是的，我愿意提交 PR! / Yes, I would like to submit a PR!

  - type: checkboxes
    attributes:
      label: Code of Conduct
      options:
        - label: >
            我已阅读并同意遵守该项目的 [行为准则](https://docs.github.com/zh/site-policy/github-terms/github-community-code-of-conduct)。
            / I have read and agree to abide by the [Code of Conduct](https://docs.github.com/site-policy/github-terms/github-community-code-of-conduct) of this project.
          required: true

  - type: markdown
    attributes:
      value: '感谢您填写我们的表单！/ Thank you for filling out our form!'
