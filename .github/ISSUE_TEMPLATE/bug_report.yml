name: '🐛 报告 Bug / Report a Bug'
description: 提交报告帮助我们改进。/ Submit a report to help us improve.
title: '[Bug] '
labels: [ 'type/fix' ]
body:
  - type: markdown
    attributes:
      value: |
        感谢您抽出时间报告问题！请准确解释您的问题。如果可能，请提供一个可复现的片段（这有助于更快地解决问题）。

        Thank you for taking the time to report an issue! Please describe the problem accurately. If possible, provide a reproducible snippet (this helps us resolve it faster).

  - type: textarea
    attributes:
      label: 发生了什么 / What happened
      description: 描述你遇到的异常。/ Describe the anomaly you encountered.
      placeholder: >
        一个清晰且具体的描述这个异常是什么。
        / A clear and specific description of what the anomaly is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 如何复现？/ How to reproduce?
      description: 复现该问题的步骤。/ Steps to reproduce the issue.
      placeholder: >
        如: 1. 打开 '...'
        / E.g.: 1. Open '...'
    validations:
      required: true

  - type: input
    attributes:
      label: 插件版本 / Plugin version
      description: 请填写你当前使用的插件版本。/ Please enter the plugin version you are currently using.
      placeholder: '如: v1.2.0 / E.g.: v1.2.0'
    validations:
      required: true

  - type: input
    attributes:
      label: AstrBot 版本 / AstrBot version
      description: 请填写你当前使用的 AstrBot 版本。/ Please enter the AstrBot version you are currently using.
      placeholder: '如: v4.22.1 / E.g.: v4.22.1'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 部署方式 / Deployment method
      description: 请选择最接近的一项。/ Please select the closest option.
      options:
        - 'uv 一键部署 / uv one-click deployment'
        - 'Docker / Docker Compose 部署 / Docker / Docker Compose deployment'
        - 'RainYun 一键云部署 / RainYun one-click cloud deployment'
        - 'AstrBot App 桌面应用部署 / AstrBot App desktop deployment'
        - 'AstrBot Launcher 部署 / AstrBot Launcher deployment'
        - 'Replit 部署 / Replit deployment'
        - 'AUR 部署 / AUR deployment'
        - 'BT-Panel 部署 / BT-Panel deployment'
        - '1Panel 部署 / 1Panel deployment'
        - 'CasaOS 部署 / CasaOS deployment'
        - '手动部署（CLI / 源码 / uv）/ Manual deployment (CLI / source / uv)'
        - '其他 / Other'
        - '不确定 / Not sure'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 使用的消息平台适配器 / Message platform adapter
      description: 请选择你当前主要复现问题的平台。如涉及多个平台，请先选择最主要的一个，并在下方补充说明。/ Select the platform where you mainly reproduce the issue. If multiple platforms are involved, choose the primary one first and add details below.
      options:
        - 'QQ 官方机器人 (Websockets 方式) / QQ Official Bot (Websockets)'
        - 'QQ 官方机器人 (Webhook 方式) / QQ Official Bot (Webhook)'
        - 'OneBot v11 (原 QQ 个人号) / OneBot v11 (legacy QQ personal account)'
        - '企微应用 / WeCom App'
        - '企微智能机器人 / WeCom Smart Robot'
        - '微信公众号 / WeChat Official Account'
        - '个人微信 / Personal WeChat'
        - '飞书 / Feishu (Lark)'
        - '钉钉 / DingTalk'
        - 'Telegram'
        - 'LINE'
        - 'Slack'
        - 'Misskey'
        - 'Discord'
        - 'KOOK'
        - 'Satori (接入 Satori) / Satori (via Satori)'
        - 'Satori (使用 server-satori) / Satori (using server-satori)'
        - 'Matrix (社区提供) / Matrix (community-provided)'
        - 'VoceChat (社区提供) / VoceChat (community-provided)'
        - '其他平台 / Other platform'
    validations:
      required: true

  - type: input
    attributes:
      label: 其他平台名称（如选择“其他平台”请填写）/ Other platform name (required if you selected "Other platform")
      description: 如果你上面选择了“其他平台”，请在这里补充实际平台名称；否则可留空。/ If you selected "Other platform" above, please specify the actual platform name here; otherwise you can leave it blank.
      placeholder: '如: 某某社区适配器 / 自定义平台 / E.g.: some community adapter / custom platform'

  - type: dropdown
    attributes:
      label: 操作系统 / Operating system
      description: 你在哪个操作系统上遇到了这个问题？/ On which operating system did you encounter this problem?
      options:
        - 'Windows'
        - 'macOS'
        - 'Linux'
        - 'Other'
        - 'Not sure'
    validations:
      required: true

  - type: textarea
    attributes:
      label: 补充说明（可选）/ Additional notes (optional)
      description: 如果涉及多个平台、多个 AstrBot 版本或特殊部署环境，请在这里补充。/ If this involves multiple platforms, multiple AstrBot versions, or a special deployment environment, please add details here.
      placeholder: >
        如: 同样的问题在 Telegram 与 QQ 官机都可复现；使用反向代理；部署在 NAS / 云服务器等。
        / E.g.: Reproducible on both Telegram and QQ Official Bot; using a reverse proxy; deployed on NAS / cloud server, etc.

  - type: textarea
    attributes:
      label: 报错日志 / Error log
      description: 如报错日志、截图等。请提供完整的 INFO 或 Debug 级别的日志，不要介意它很长！/ Such as error logs, screenshots, etc. Please provide complete INFO or Debug level logs — don't worry if they are long!
      placeholder: >
        请提供完整的报错日志或截图。
        / Please provide the full error log or screenshots.
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: 你愿意提交 PR 吗？/ Would you like to submit a PR?
      description: 这不是必需的，但我们很乐意在贡献过程中为您提供指导，特别是如果你已经很好地理解了如何实现修复。/ This is not required, but we are happy to guide you through the contribution process, especially if you already have a good understanding of how to implement the fix.
      options:
        - label: 是的，我愿意提交 PR! / Yes, I would like to submit a PR!

  - type: checkboxes
    attributes:
      label: Code of Conduct
      options:
        - label: >
            我已阅读并同意遵守该项目的 [行为准则](https://docs.github.com/zh/site-policy/github-terms/github-community-code-of-conduct)。
            / I have read and agree to abide by the [Code of Conduct](https://docs.github.com/site-policy/github-terms/github-community-code-of-conduct) of this project.
          required: true

  - type: markdown
    attributes:
      value: '感谢您填写我们的表单！/ Thank you for filling out our form!'
